
plugins {
    id 'com.android.application' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.example.tcllauncher'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId 'com.example.tcllauncher'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}
